<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">

        <div class="box">
            <h1>Login Form</h1>
            <br>
            <!-- buttons -->
            <div class="top">
             <button class="log">Login</button>
            <a href="./signup.html"><button class="su">Signup</button></a>
           </div>

           <!-- form start -->
            <input class="email" type="email" name="" id="" placeholder="Email Address">
            <input class="pass" type="password" name="" id="" placeholder="Password">
            <p class="p">Forgot password?</p>
            <button class="last" >Login</button>
            <p class="p2">Not a member? <a href="./signup.html">Signup now</a> </p>


        </div>

    </div>

</body>
</html>
